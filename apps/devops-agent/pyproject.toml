[project]
name = "devops-agent-lab"
version = "0.1.0"
description = "DevOps Agent Lab: the Unsafe Infrastructure Action scenario, built on GhostReplay"
requires-python = ">=3.12"
dependencies = ["ghostreplay"]

[project.scripts]
devops-agent-lab = "devops_agent.cli:main"

[project.entry-points."ghostreplay.scenarios"]
unsafe-infra-action = "devops_agent.scenario:UnsafeInfraActionScenario"

[project.entry-points."ghostreplay.labs"]
devops = "devops_agent.cli:build_lab"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devops_agent"]

[tool.uv.sources]
ghostreplay = { workspace = true }
