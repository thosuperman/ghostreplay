[project]
name = "invoice-agent-example"
version = "0.1.0"
description = "An invoice-processing agent instrumented with the public GhostReplay SDK"
requires-python = ">=3.12"
# Only the public SDK: no imports from the bundled Support or DevOps labs.
dependencies = ["ghostreplay>=0.1"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
invoice-agent-demo = "invoice_agent.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invoice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
