name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  NODE_VERSION: "24"

jobs:
  python:
    name: Python — lint, tests, demos, regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (locked)
        run: uv sync --locked --all-extras
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Unit, integration and regression tests
        run: uv run pytest --junitxml=reports/pytest.xml
      - name: Demo — Duplicate Refund (fails on unexpected outcome)
        run: uv run support-agent-lab --db "$RUNNER_TEMP/demo" demo
      - name: Demo — Unsafe Infrastructure Action (fails on unexpected outcome)
        run: uv run devops-agent-lab --db "$RUNNER_TEMP/demo" demo
      - name: Committed regression cases
        run: >
          uv run ghostreplay test tests/regression
          --junit reports/regression-committed.xml --json reports/regression-committed.json
      - name: Freshly generated regression cases
        run: |
          uv run support-agent-lab --db "$RUNNER_TEMP/export" export-cases --out "$RUNNER_TEMP/cases"
          uv run devops-agent-lab --db "$RUNNER_TEMP/export" export-cases --out "$RUNNER_TEMP/cases"
          uv run ghostreplay test "$RUNNER_TEMP/cases" --junit reports/regression-fresh.xml
          uv run pytest "$RUNNER_TEMP/cases" -q
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-reports
          path: reports/

  sdk:
    name: SDK — clean install + external invoice agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the SDK wheel
        run: |
          python -m pip install build
          python -m build packages/ghostreplay --outdir dist
      - name: Install the wheel and the external example in a fresh virtual environment
        run: |
          python -m venv /tmp/sdk-venv
          /tmp/sdk-venv/bin/pip install dist/ghostreplay-*.whl -e "examples/invoice-agent[test]"
          /tmp/sdk-venv/bin/python -c "import sys, ghostreplay; assert 'fastapi' not in sys.modules"
      - name: Invoice agent demo (record, inject, replay, fix, regression)
        working-directory: examples/invoice-agent
        env:
          INVOICE_AGENT_DATA: ":memory:"
        run: /tmp/sdk-venv/bin/invoice-agent-demo
      - name: Committed regression cases fail CI on an unexpected outcome
        working-directory: examples/invoice-agent
        run: /tmp/sdk-venv/bin/ghostreplay test tests/regression --import invoice_agent.agent
      - name: Example unit tests
        working-directory: examples/invoice-agent
        run: /tmp/sdk-venv/bin/pytest
      - name: Documented SDK examples run as published
        working-directory: docs/sdk/examples
        run: |
          /tmp/sdk-venv/bin/python hello.py
          /tmp/sdk-venv/bin/python quickstart.py
          /tmp/sdk-venv/bin/pytest -q -p no:cacheprovider tests/regression

  dashboard:
    name: Dashboard — typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Resolve pnpm store
        id: pnpm
        run: echo "store=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm --dir apps/dashboard typecheck
      - run: corepack pnpm --dir apps/dashboard build

  e2e:
    name: End-to-end (Playwright)
    needs: [python, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: uv sync --locked
      - run: corepack pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: corepack pnpm --dir apps/dashboard exec playwright install --with-deps chromium
      - name: Run browser tests against the gateway (both labs + built dashboard)
        run: corepack pnpm --dir apps/dashboard e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report/

  docker:
    name: Container — build and smoke test
    needs: [python, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ghostreplay-lab:ci .
      - name: Start container in the public profile
        run: docker run -d --name gr -p 8100:8100 -e GHOSTREPLAY_PUBLIC=1 ghostreplay-lab:ci
      - name: Health and demo smoke test
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8100/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8100/ | grep -q '<div id="root">'
          for lab in support:duplicate-refund devops:unsafe-infra-action; do
            curl -fsS -X POST "http://127.0.0.1:8100/lab/${lab%%:*}/api/demo/prepare" \
              -H 'content-type: application/json' -d "{\"scenario\":\"${lab##*:}\"}" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"], d; print("demo ok")'
          done
      - name: Container logs
        if: always()
        run: docker logs gr || true
