[project]
name = "ghostreplay"
version = "0.1.0"
description = "Deterministic replay, failure injection and regression testing for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
ghostreplay = "ghostreplay.cli:main"

[project.optional-dependencies]
live = [
    "anthropic>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ghostreplay"]
